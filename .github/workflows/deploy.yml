name: Deploye to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
           username: ${{ vars.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hello-api:latest

  deploye-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Create SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploye to EC2 via SSH
#        uses: appleboy/ssh-action@v1
#        with:
#          host: ${{ secrets.EC2_HOST }}
#          username: ${{ secrets.EC2_USER }}
#          password: ${{ secrets.EC2_KEY }}
        run: |
          ssh -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/hello-api:latest
          docker stop hello-api || true
          docker rm hello-api || true
          docker run -d -p 8080:8080 --name hello-api ${{ secrets.DOCKER_USERNAME }}/hello-api:latest
